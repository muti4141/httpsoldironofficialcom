<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHALK — Strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #080808;
    --bone: #dcdcdc;
    --ink: #f4f4f4;
    --hair: rgba(255, 255, 255, .12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    background: var(--base);
    color: var(--ink);
    font-family: "Inter Tight", sans-serif;
    overflow-x: hidden;
  }
  ::selection { background: var(--bone); color: var(--base); }

  /* ── Fixed chrome ─────────────────────────────────────── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px clamp(20px, 4vw, 48px);
  }
  .wordmark {
    font-weight: 600; font-size: 17px; letter-spacing: -.02em;
    color: var(--ink); text-decoration: none;
  }
  .nav-links { display: flex; gap: 28px; align-items: center; }
  .nav-links a {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: rgba(255,255,255,.55); text-decoration: none;
    transition: color .25s;
  }
  .nav-links a:hover { color: var(--ink); }
  .pill {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink); text-decoration: none;
    border: 1px solid var(--hair); border-radius: 999px;
    padding: 10px 20px; transition: border-color .25s, background .25s, color .25s;
  }
  .pill:hover { border-color: var(--bone); }
  .pill.solid { background: var(--bone); color: var(--base); border-color: var(--bone); }
  .pill.solid:hover { background: #ffffff; }

  .scrub-ui {
    position: fixed; left: clamp(20px, 4vw, 48px); bottom: 28px; z-index: 50;
    display: flex; align-items: center; gap: 14px;
  }
  .pct {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; color: rgba(255,255,255,.65); min-width: 26px;
  }
  .rail { width: 120px; height: 1px; background: var(--hair); position: relative; }
  .rail-fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: var(--bone);
  }

  .specs {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 28px; z-index: 50;
    display: flex; gap: 32px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: .06em; color: rgba(255,255,255,.45);
    white-space: nowrap;
  }
  .specs b { color: rgba(255,255,255,.8); font-weight: 500; }

  /* ── Sticky stage ─────────────────────────────────────── */
  .stage { height: 700vh; position: relative; }
  .stage-sticky {
    position: sticky; top: 0; height: 100vh; overflow: hidden;
  }
  #film {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 220px 90px rgba(0,0,0,.85);
  }
  .scrim-top {
    position: absolute; top: 0; left: 0; right: 0; height: 28vh; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.82), transparent);
  }
  .scrim-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40vh; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.92), transparent);
  }

  /* ── Loading overlay ──────────────────────────────────── */
  .loader {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: var(--base);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(255,255,255,.5);
    transition: opacity .8s ease;
  }
  .loader.off { opacity: 0; pointer-events: none; }

  /* ── Caption beats ────────────────────────────────────── */
  .beat {
    position: absolute; left: clamp(20px, 5vw, 64px); right: clamp(20px, 5vw, 64px);
    z-index: 5;
    font-size: clamp(30px, 4.6vw, 64px);
    font-weight: 500; letter-spacing: -.035em; line-height: 1.05;
    color: var(--ink);
    text-shadow: 0 2px 30px rgba(0,0,0,.9), 0 0 80px rgba(0,0,0,.7);
    opacity: 0; transform: translateY(18px);
    transition: opacity .7s ease, transform .7s ease;
    pointer-events: none;
  }
  .beat.on { opacity: 1; transform: translateY(0); }
  .beat.upper { top: 22vh; }
  .beat.lower { bottom: 18vh; }

  /* ── Closing ──────────────────────────────────────────── */
  .closing {
    min-height: 60vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 80px 20px; text-align: center;
  }
  .closing p {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.45);
  }

  @media (max-width: 820px) {
    .nav-links a { display: none; }
    .specs { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage { height: auto; }
    .stage-sticky { position: static; height: auto; min-height: 100vh; }
    .beat { position: static; opacity: 1; transform: none; padding: 24px clamp(20px,5vw,64px); }
  }
</style>
</head>
<body>

  <!-- Fixed chrome -->
  <nav>
    <a class="wordmark" href="/">CHALK</a>
    <div class="nav-links">
      <a href="/shop">Method</a>
      <a href="/shop">Coaches</a>
      <a href="/shop">Membership</a>
      <a href="/shop">Visit</a>
      <a class="pill" href="/shop">Start training</a>
    </div>
  </nav>

  <div class="scrub-ui">
    <span class="pct" id="pct">00</span>
    <div class="rail"><div class="rail-fill" id="railFill"></div></div>
  </div>

  <div class="specs">
    <span><b>4:45</b> doors open</span>
    <span><b>0</b> mirrors</span>
    <span><b>1</b> rule</span>
  </div>

  <!-- Sticky stage: FIRST element -->
  <section class="stage" id="stage">
    <div class="stage-sticky">
      <video id="film" muted playsinline preload="auto"></video>
      <div class="vignette"></div>
      <div class="scrim-top"></div>
      <div class="scrim-bottom"></div>

      <div class="loader" id="loader">Loading</div>

      <h1 class="beat upper" data-from="0.00" data-to="0.14">Before the lift.</h1>
      <p  class="beat lower" data-from="0.24" data-to="0.38">Five in the morning. Empty room.</p>
      <p  class="beat lower" data-from="0.72" data-to="0.88">The dust is the receipt.</p>
    </div>
  </section>

  <!-- Closing -->
  <section class="closing">
    <p>No shortcuts</p>
    <a class="pill solid" href="/shop">LANSMANI KEŞFET</a>
  </section>

<script>
(function () {
  var VIDEO_URL = "/videos/hero.mp4";

  var film     = document.getElementById("film");
  var loader   = document.getElementById("loader");
  var stage    = document.getElementById("stage");
  var pctEl    = document.getElementById("pct");
  var railFill = document.getElementById("railFill");
  var beats    = Array.prototype.slice.call(document.querySelectorAll(".beat"));

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Blob fetch: bazı sunucular byte-range desteklemez, seekable [0,0] kalır */
  fetch(VIDEO_URL)
    .then(function (r) { return r.blob(); })
    .then(function (blob) {
      film.src = URL.createObjectURL(blob);
      if (reduced) film.controls = true;
    })
    .catch(function () {
      loader.textContent = "Video failed to load";
    });

  film.addEventListener("loadeddata", function () {
    loader.classList.add("off");
    try { film.currentTime = 0; } catch (e) {}
  });

  if (reduced) {
    /* Azaltılmış hareket: her beat açık, scrub yok */
    beats.forEach(function (b) { b.classList.add("on"); });
    return;
  }

  var current = 0, target = 0;

  function loop() {
    var rect = stage.getBoundingClientRect();
    var total = stage.offsetHeight - window.innerHeight;
    target = Math.min(1, Math.max(0, -rect.top / total));

    /* Ease — kaydırmayı süzülür yapan satır */
    current += (target - current) * 0.12;

    if (film.duration) {
      var t = current * (film.duration - 0.05);
      /* Dekoderi boğmamak için eşik */
      if (Math.abs(film.currentTime - t) > 0.005) {
        try { film.currentTime = t; } catch (e) {}
      }
    }

    var pct = Math.round(current * 100);
    pctEl.textContent = (pct < 10 ? "0" : "") + pct;
    railFill.style.width = (current * 100) + "%";

    for (var i = 0; i < beats.length; i++) {
      var b = beats[i];
      var from = parseFloat(b.dataset.from), to = parseFloat(b.dataset.to);
      b.classList.toggle("on", current >= from && current <= to);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
