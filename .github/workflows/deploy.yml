name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}

      - name: Deploy Worker
        run: ./node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Route oldironofficial.com to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Zone ID'yi al
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=oldironofficial.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d['result'] else '')")

          echo "Zone ID: $ZONE_ID"

          if [ -z "$ZONE_ID" ]; then
            echo "Zone bulunamadı — domain Cloudflare'de değil olabilir"
            exit 1
          fi

          # Mevcut Worker route'larını sil
          ROUTES=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; [print(r['id']) for r in json.load(sys.stdin).get('result', [])]")

          for ROUTE_ID in $ROUTES; do
            echo "Route siliniyor: $ROUTE_ID"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          done

          # oldironofficial.com/* → tanstack-start-app
          echo "Route ekleniyor: oldironofficial.com/*"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"pattern":"oldironofficial.com/*","script":"tanstack-start-app"}'

          # www.oldironofficial.com/* → tanstack-start-app
          echo "Route ekleniyor: www.oldironofficial.com/*"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"pattern":"www.oldironofficial.com/*","script":"tanstack-start-app"}'

          echo "Domain routing tamamlandı"
