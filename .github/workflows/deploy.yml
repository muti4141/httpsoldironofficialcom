name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}

      - name: Deploy Worker
        # Vite/Cloudflare eklentisinin ürettiği yapılandırmayla dağıt —
        # istemci paketi ve statik dosyalar bu config üzerinden yükleniyor
        run: ./node_modules/.bin/wrangler deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: iyzico gizli anahtarlarını Worker'a yaz
        # GitHub repo secrets'ta IYZICO_API_KEY / IYZICO_SECRET_KEY tanımlıysa
        # Cloudflare Worker'ın secret store'una yazar. Anahtarlar hiçbir zaman
        # kodda veya loglarda görünmez. (if: içinde doğrudan `secrets` bağlamı
        # kullanılamıyor — bu yüzden önce env'e taşınıyor.)
        if: ${{ env.IYZICO_API_KEY != '' && env.IYZICO_SECRET_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
        run: |
          echo "$IYZICO_API_KEY" | ./node_modules/.bin/wrangler secret put IYZICO_API_KEY -c dist/server/wrangler.json
          echo "$IYZICO_SECRET_KEY" | ./node_modules/.bin/wrangler secret put IYZICO_SECRET_KEY -c dist/server/wrangler.json

      - name: Supabase service role anahtarını Worker'a yaz
        # order_items/orders'ı RLS'i atlayarak güncellemek için (iyzico
        # callback'i, sipariş e-postaları) gereken gerçek gizli anahtar.
        # Eksikse ödeme callback'i sessizce 500 döner ve sipariş asla
        # "paid" olarak işaretlenmez.
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "$SUPABASE_SERVICE_ROLE_KEY" | ./node_modules/.bin/wrangler secret put SUPABASE_SERVICE_ROLE_KEY -c dist/server/wrangler.json

      - name: Sipariş e-posta anahtarlarını Worker'a yaz (opsiyonel)
        if: ${{ env.RESEND_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "$RESEND_API_KEY" | ./node_modules/.bin/wrangler secret put RESEND_API_KEY -c dist/server/wrangler.json

      - name: Fix DNS + Route domain to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --- 1. Zone ID'yi al ---
          ZONE_RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=oldironofficial.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          ZONE_ID=$(echo "$ZONE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d['result'] else '')")
          echo "Zone ID: $ZONE_ID"

          if [ -z "$ZONE_ID" ]; then
            echo "HATA: Zone bulunamadı"
            exit 1
          fi

          # --- 2. Pages custom domain'i sil ---
          for DOMAIN in oldironofficial.com www.oldironofficial.com; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/httpsoldironofficialcom/domains/$DOMAIN" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "Pages domain silindi ($DOMAIN): HTTP $STATUS"
          done

          # --- 3. DNS kayıtlarını kontrol et ve proxied yap ---
          for HOST in oldironofficial.com www.oldironofficial.com; do
            DNS_RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$HOST" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "DNS kayıtları ($HOST): $DNS_RESP"

            RECORD_ID=$(echo "$DNS_RESP" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else '')")
            RECORD_TYPE=$(echo "$DNS_RESP" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['type'] if r else '')")
            IS_PROXIED=$(echo "$DNS_RESP" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(str(r[0].get('proxied',False)).lower() if r else 'false')")

            echo "$HOST → id=$RECORD_ID type=$RECORD_TYPE proxied=$IS_PROXIED"

            if [ -z "$RECORD_ID" ]; then
              # Kayıt yok — proxied A kaydı oluştur (IP önemli değil, Cloudflare proxy kullanıyor)
              echo "$HOST için DNS A kaydı oluşturuluyor..."
              curl -s -X POST \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$HOST\",\"content\":\"192.0.2.1\",\"proxied\":true,\"ttl\":1}"
            elif [ "$IS_PROXIED" = "false" ]; then
              # Kayıt var ama proxy kapalı — güncelle
              echo "$HOST proxy kapalı, açılıyor..."
              RECORD_CONTENT=$(echo "$DNS_RESP" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0].get('content','192.0.2.1') if r else '192.0.2.1')")
              curl -s -X PATCH \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"proxied\":true}"
            else
              echo "$HOST zaten proxied ✓"
            fi
          done

          # --- 4. Mevcut Worker route'larını sil ---
          ROUTES=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; [print(r['id']) for r in json.load(sys.stdin).get('result', [])]")

          for ROUTE_ID in $ROUTES; do
            echo "Route siliniyor: $ROUTE_ID"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          done

          # --- 5. Worker route'larını ekle ---
          echo "Route ekleniyor: oldironofficial.com/*"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"pattern":"oldironofficial.com/*","script":"tanstack-start-app"}'

          echo "Route ekleniyor: www.oldironofficial.com/*"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"pattern":"www.oldironofficial.com/*","script":"tanstack-start-app"}'

          echo "Tamamlandı ✓"

      - name: Domain teshisi
        if: always()
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== DNS COZUMLEME ==="
          for H in oldironofficial.com www.oldironofficial.com; do
            IPS=$(getent ahostsv4 "$H" | awk '{print $1}' | sort -u | tr '\n' ' ')
            echo "$H -> ${IPS:-COZUMLENEMEDI}"
          done

          echo "=== HTTP YANITI ==="
          for H in oldironofficial.com www.oldironofficial.com; do
            echo "--- https://$H ---"
            curl -sSI --max-time 20 "https://$H" 2>&1 | head -12
            echo "  --- icerik ---"
            curl -sS --max-time 20 "https://$H" 2>&1 | tr -d '\n' | head -c 260
            echo ""
          done

          echo "=== WORKER REFERANS ==="
          curl -sSI --max-time 20 https://tanstack-start-app.mutlucanelcn.workers.dev/ 2>&1 | head -6

          echo "=== ZONE DURUMU ==="
          curl -s "https://api.cloudflare.com/client/v4/zones?name=oldironofficial.com" -H "Authorization: Bearer $CF_TOKEN" > /tmp/z.json
          python3 -c "import json;d=json.load(open('/tmp/z.json'));r=d.get('result') or [];print('YOK' if not r else 'id=%s durum=%s paused=%s' % (r[0].get('id'),r[0].get('status'),r[0].get('paused')))"
          python3 -c "import json;d=json.load(open('/tmp/z.json'));r=d.get('result') or [];print('ns=%s' % (r[0].get('name_servers') if r else '-'))"

      - name: Custom Domain bagla (Pages bagini ez)
        if: always()
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/bind_domain.py

      - name: Son kontrol
        if: always()
        continue-on-error: true
        run: |
          set +e
          sleep 40
          for H in oldironofficial.com www.oldironofficial.com; do
            CODE=$(curl -sS -o /tmp/o.html -w "%{http_code}" --max-time 20 "https://$H")
            TITLE=$(grep -o "<title>[^<]*</title>" /tmp/o.html | head -1)
            echo "$H -> HTTP $CODE $TITLE"
          done
